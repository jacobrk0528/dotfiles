# Installed to /etc/greetd/hyprland.conf — the throwaway compositor the greeter
# draws in. Nothing here is shared with hypr/hyprland.lua; the greeter must keep
# working even if the real config is broken.

monitor = , preferred, auto, 1

env = QT_QPA_PLATFORM,wayland
env = XCURSOR_SIZE,24

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_autoreload = true
}

input {
    kb_layout = us
    numlock_by_default = true
    follow_mouse = 1
}

# Quickshell exits after Greetd.launch(..., quit: true); dispatching exit then
# tears down this compositor so greetd can hand the VT to the real session.
exec-once = /usr/bin/qs -p /etc/greetd/quickshell-greeter; hyprctl dispatch exit
