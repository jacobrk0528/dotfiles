general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.exec_raw("dpms on")'
}

# Dim the screens as a warning before locking.
listener {
    timeout = 480
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Screens off a little after the lock engages.
listener {
    timeout = 1020
    on-timeout = hyprctl dispatch 'hl.dsp.exec_raw("dpms off")'
    on-resume = hyprctl dispatch 'hl.dsp.exec_raw("dpms on")'
}
