general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = shot, 0.2, 1.0, 0.2, 1.0
    bezier = swipe, 0.6, 0.0, 0.2, 1.05
    bezier = bounce, 1, 1.6, 0.1, 0.85
    bezier = decel, 0.05, 0.7, 0.1, 1

    animation = fadeIn, 1, 7, shot
    animation = fadeOut, 1, 7, shot
    animation = inputFieldFade, 1, 7, shot
    animation = inputFieldWidth, 1, 7, shot
    animation = inputFieldColor, 1, 7, shot
}

background {
    monitor = 
    path = screenshot
    color = rgba(13, 17, 23, 1.0)
    blur_passes = 3
    blur_size = 10
    noise = 0.0117
    contrast = 0.8
    brightness = 0.45
}

# HUGE CENTER CLOCK
label {
    monitor = DP-2
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 180
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.5)
}

# CARD (Modern Glass Container)
shape {
    monitor = DP-2
    size = 450, 220
    color = rgba(13, 17, 23, 0.75)
    rounding = 16
    border_size = 1
    border_color = rgba(255, 255, 255, 0.08)
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
}

# WELCOME TEXT
label {
    monitor = DP-2
    text = Welcome back, <span foreground="##ffffffaa">$USER</span>
    color = rgba(255, 255, 255, 0.8)
    font_size = 24
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, -10
    halign = center
    valign = center
}

# PASSWORD FIELD
input-field {
    monitor = DP-2
    size = 380, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1) rgba(255, 255, 255, 0.3) 45deg
    inner_color = rgba(0, 0, 0, 0.3)
    font_color = rgb(200, 200, 200)
    fade_on_empty = true
    placeholder_text = <span font_style="italic">Enter Password...</span>
    hide_input = false
    
    # Check & Fail animations
    check_color = rgba(0, 255, 127, 0.8) rgba(0, 255, 255, 0.8) 45deg
    fail_color = rgba(255, 0, 0, 0.8) rgba(255, 127, 0, 0.8) 45deg
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    
    position = 0, -70
    halign = center
    valign = center
}

# SYSTEM INFO
label {
    monitor = DP-2
    text = cmd[update:1000] echo "<b>$(date +'%A, %B %d')</b> | $(hostname)"
    color = rgba(255, 255, 255, 0.5)
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}
