#
# Slate & Frost. Colours come from hyprlock-colors.conf, generated by
# quickshell/scripts/apply-theme — edit theme.json, not the values here.
#
# Every element is unpinned from a specific monitor so the card renders on
# all of them; pinning to a name breaks the moment the KVM reshuffles ports.

source = ~/.config/hypr/hyprlock-colors.conf
source = ~/.config/hypr/wallpaper.conf

general {
    no_fade_in = false
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.3, 1
    bezier = snap,   0.2,  1, 0.2, 1

    animation = fadeIn,           1, 5, smooth
    animation = fadeOut,          1, 4, smooth
    animation = inputFieldDots,   1, 3, snap
    animation = inputFieldColors, 1, 4, smooth
    animation = inputFieldFade,   1, 4, smooth
    animation = inputFieldWidth,  1, 3, smooth
}

# ── Background ───────────────────────────────────────────────────
# The wallpaper, not a screenshot: a blurred screenshot still leaks whatever
# was on screen when the lock engaged.
background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 6
    noise = 0.008
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.15
}

# ── Clock ────────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 132
    font_family = JetBrainsMono Nerd Font ExtraLight
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(00000080)
    shadow_boost = 1.1
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %-d'
    color = $accent
    font_size = 19
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 118
    halign = center
    valign = center
}

# ── Card ─────────────────────────────────────────────────────────
shape {
    monitor =
    size = 460, 232
    color = $surface
    rounding = 20
    border_size = 1
    border_color = $border
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 14
    shadow_color = rgba(00000066)
}

# Avatar ring
shape {
    monitor =
    size = 74, 74
    color = rgba(00000000)
    rounding = 37
    border_size = 2
    border_color = $accent
    position = 0, 6
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰀄
    color = $accent
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 0, 6
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 17
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -52
    halign = center
    valign = center
}

# ── Password ─────────────────────────────────────────────────────
input-field {
    monitor =
    size = 380, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = $border
    inner_color = rgba(00000059)
    font_color = $text
    font_family = JetBrainsMono Nerd Font

    fade_on_empty = false
    placeholder_text = <span foreground="##8b949e">Password</span>
    hide_input = false

    check_color = $accent
    fail_color = $err
    fail_text = <b>$FAIL</b>  ($ATTEMPTS)
    fail_timeout = 1800
    fail_transition = 250

    capslock_color = $accent
    numlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -120
    halign = center
    valign = center
}

# ── Now playing ──────────────────────────────────────────────────
# Text only, on a 22px pitch, sharing the 32px left edge with the status strip
# below so the whole bottom-left column aligns on one line.
#
# No album art: hyprlock 0.9.6 decodes an `image` once at startup and honours
# neither reload_cmd/reload_time nor SIGUSR2, so a cover would freeze at
# whatever was playing when the lock engaged — and would still be sitting there
# with nothing playing. lock-media prints nothing when no player is playing, so
# these three labels collapse to nothing instead.
label {
    monitor =
    text = cmd[update:5000] $HOME/.config/quickshell/scripts/lock-media header
    color = $accent
    font_size = 12
    font_family = JetBrainsMono Nerd Font Medium
    position = 32, 118
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] $HOME/.config/quickshell/scripts/lock-media title
    color = $text
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    # 95, not 96: font 14 has a taller box than the 12s around it, so an even
    # 22px pitch would leave a wider gap under the title than over it.
    position = 32, 95
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] $HOME/.config/quickshell/scripts/lock-media artist
    color = rgba(ffffff66)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 32, 74
    halign = left
    valign = bottom
}

# ── Specs ────────────────────────────────────────────────────────
# Mirrors the status strip: same 32px edge inset, and line 2 shares the y=28
# baseline with it so the two bottom corners read as one line across the screen.
label {
    monitor =
    text = cmd[update:6000] $HOME/.config/quickshell/scripts/lock-specs 1
    color = rgba(ffffff66)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -32, 52
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:6000] $HOME/.config/quickshell/scripts/lock-specs 2
    color = rgba(ffffff66)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -32, 28
    halign = right
    valign = bottom
}

# ── Status strip ─────────────────────────────────────────────────
# uname -n, not hostname(1): hyprlock runs these with a minimal PATH that has no
# /usr/bin/hostname, which silently left the name blank.
label {
    monitor =
    text = cmd[update:30000] echo "󰍹  $(uname -n)   ·   󰅐  up $(uptime -p | sed 's/^up //')"
    color = rgba(ffffff66)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 32, 28
    halign = left
    valign = bottom
}

label {
    monitor =
    text = Enter your password to unlock
    color = rgba(ffffff40)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -196
    halign = center
    valign = center
}
