# Colours, generated from quickshell/theme.json by quickshell/scripts/apply-theme.
source-file -q ~/dotfiles/tmux/theme.conf

# tmux 3.8 themes: use the terminal's own ANSI palette (detect guesses "light"
# here), and keep popups/menus on the terminal background like 3.7 did.
set -sq theme terminal
set -g popup-style default
set -g popup-border-style default
set -g menu-style default
set -g menu-border-style default

# General Settings
set -g mouse on                               # Enable mouse support
set -g history-limit 10000                    # Increase scrollback buffer
set -g prefix C-a                             # Change prefix to Ctrl+A
unbind C-b                                    # Unbind default prefix
bind C-a send-prefix                          # Allow double Ctrl+A for prefix
set-option -g automatic-rename-format '#{?#{==:#{pane_current_command},sudo},#(~/.tmux/rename.sh),#{?#{==:#{pane_current_command},ssh},#(~/.tmux/rename.sh),#{?#{==:#{pane_current_command},zsh},zsh,#{?#{==:#{pane_current_command},bash},zsh,#{pane_current_command}}}}}'

set-option -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u

# Status Bar Settings
set -g status on                              # Enable status bar
set -g status-justify centre                  # Center-align status items
set -g status-interval 5                      # Update every 5 seconds
# status-style, pane-border-style and pane-active-border-style come from theme.conf

# Left and Right Status Content
set -g status-left " #S "                     # Show session name
# status-right (with its clock colours) comes from theme.conf

# Window Title and Indicators
setw -g window-status-format " #I:#W "        # Window number and name
setw -g window-status-current-format " #[bold]#I:#W " # Highlight active window

# Append to tmux's default list (SSH_AUTH_SOCK, DISPLAY, WAYLAND_DISPLAY, XDG_*)
# rather than replacing it; fixed indices so re-sourcing doesn't duplicate.
set -g update-environment[20] HYPRLAND_INSTANCE_SIGNATURE
set -g update-environment[21] HYPRLAND_CMD_SOCKET

# Key Bindings for Efficiency
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"  # Reload config
bind | split-window -h                        # Split window vertically
bind - split-window -v                        # Split window horizontally
bind H select-pane -L                         # Move to left pane
bind L select-pane -R                         # Move to right pane
bind J select-pane -D                         # Move to bottom pane
bind K select-pane -U                         # Move to top pane
bind C-c new-session                          # Create new session
bind C new-window                             # Re-homed: prefix c is now a session jump key
bind D detach-client                          # Re-homed: prefix d is now a session jump key

bind f display-popup -E "tmux list-sessions -F '#S' | grep -vx agents-view | fzf --reverse --header 'Jump to Session' | xargs -r tmux switch-client -t"

# Direct jump-to-session keys, generated from ~/.tmux/sessions.list (the single
# source of truth shared with scripts/start_tmux_sessions.sh). Also binds
# prefix S to the cheatsheet. run-shell because tmux.conf cannot loop.
run-shell "~/.tmux/gen_session_binds.sh"

# Harpoon for sessions (tmux/harpoon.sh). After the generated binds so these win.
bind a run-shell "~/.tmux/harpoon.sh add"
bind h run-shell "~/.tmux/harpoon.sh go 1"
bind j run-shell "~/.tmux/harpoon.sh go 2"
bind k run-shell "~/.tmux/harpoon.sh go 3"
bind l run-shell "~/.tmux/harpoon.sh go 4"
bind e display-popup -E -w 60 -h 14 -T " harpoon " "~/.tmux/harpoon.sh edit"

# Switch windows using Alt + Number without prefix. In the agents hub
# (scripts/agents) Alt+1-9 show agent N instead, since the hub has one window.
bind-key -n M-0 select-window -t 0
bind-key -n M-1 if -F '#{==:#{session_name},agents}' 'send-keys -t =agents:0.0 1' 'select-window -t 1'
bind-key -n M-2 if -F '#{==:#{session_name},agents}' 'send-keys -t =agents:0.0 2' 'select-window -t 2'
bind-key -n M-3 if -F '#{==:#{session_name},agents}' 'send-keys -t =agents:0.0 3' 'select-window -t 3'
bind-key -n M-4 if -F '#{==:#{session_name},agents}' 'send-keys -t =agents:0.0 4' 'select-window -t 4'
bind-key -n M-5 if -F '#{==:#{session_name},agents}' 'send-keys -t =agents:0.0 5' 'select-window -t 5'
bind-key -n M-6 if -F '#{==:#{session_name},agents}' 'send-keys -t =agents:0.0 6' 'select-window -t 6'
bind-key -n M-7 if -F '#{==:#{session_name},agents}' 'send-keys -t =agents:0.0 7' 'select-window -t 7'
bind-key -n M-8 if -F '#{==:#{session_name},agents}' 'send-keys -t =agents:0.0 8' 'select-window -t 8'
bind-key -n M-9 if -F '#{==:#{session_name},agents}' 'send-keys -t =agents:0.0 9' 'select-window -t 9'

# Agents hub: drive the sidebar (pane 0) from anywhere in the hub, including
# while typing to Claude in the viewer. Outside the hub the keys pass through.
# Every one leaves focus on the sidebar, ready for arrows, except Alt+l and
# Alt+1-9, which land in the viewer ready to type.
#   Alt+j/k  next/previous agent    Alt+u  next agent that needs you
#   Alt+h/l  focus sidebar/viewer
#   Alt+t    new Claude in the current agent's project
#   Alt+n    pick a project and start a new Claude there
#   Alt+c    close the current agent
bind-key -n M-j if -F '#{==:#{session_name},agents}' 'select-pane -t =agents:0.0 ; send-keys -t =agents:0.0 j' 'send-keys M-j'
bind-key -n M-k if -F '#{==:#{session_name},agents}' 'select-pane -t =agents:0.0 ; send-keys -t =agents:0.0 k' 'send-keys M-k'
bind-key -n M-u if -F '#{==:#{session_name},agents}' 'select-pane -t =agents:0.0 ; send-keys -t =agents:0.0 n' 'send-keys M-u'
bind-key -n M-t if -F '#{==:#{session_name},agents}' 'select-pane -t =agents:0.0 ; send-keys -t =agents:0.0 t' 'send-keys M-t'
bind-key -n M-c if -F '#{==:#{session_name},agents}' 'select-pane -t =agents:0.0 ; send-keys -t =agents:0.0 x' 'send-keys M-c'
bind-key -n M-n if -F '#{==:#{session_name},agents}' 'select-pane -t =agents:0.0 ; display-popup -E -w 40 -h 16 -T " new agent " "~/dotfiles/scripts/agents/agents --pick"' 'send-keys M-n'
bind-key -n M-h if -F '#{==:#{session_name},agents}' 'select-pane -t =agents:0.0' 'send-keys M-h'
bind-key -n M-l if -F '#{==:#{session_name},agents}' 'select-pane -t =agents:0.1' 'send-keys M-l'

bind Tab switch-client -l

set -g base-index 1

# Enable vi mode
set-window-option -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Additional vi copy mode bindings
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi _ send-keys -X start-of-line
bind-key -T copy-mode-vi $ send-keys -X end-of-line
