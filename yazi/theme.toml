# Generated by quickshell/scripts/apply-theme — edit theme.json instead.

[mgr]
cwd = { fg = "#8ab7e6" }

find_keyword  = { fg = "#e2d479", bold = true, italic = true, underline = true }
find_position = { fg = "#e279ad", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "#8d949a", italic = true }

marker_copied   = { fg = "#79e29c",  bg = "#79e29c" }
marker_cut      = { fg = "#e27979",    bg = "#e27979" }
marker_marked   = { fg = "#8ab7e6", bg = "#8ab7e6" }
marker_selected = { fg = "#e2d479", bg = "#e2d479" }

count_copied   = { fg = "#0c1218", bg = "#79e29c" }
count_cut      = { fg = "#0c1218", bg = "#e27979" }
count_selected = { fg = "#0c1218", bg = "#e2d479" }

border_symbol = "│"
border_style  = { fg = "#141e29" }

[tabs]
active   = { fg = "#0c1218", bg = "#8ab7e6", bold = true }
inactive = { fg = "#8d949a", bg = "#141e29" }

[mode]
normal_main = { fg = "#0c1218", bg = "#8ab7e6", bold = true }
normal_alt  = { fg = "#8ab7e6", bg = "#141e29" }
select_main = { fg = "#0c1218", bg = "#79e29c", bold = true }
select_alt  = { fg = "#79e29c", bg = "#141e29" }
unset_main  = { fg = "#0c1218", bg = "#e2b179", bold = true }
unset_alt   = { fg = "#e2b179", bg = "#141e29" }

[status]
perm_sep   = { fg = "#888b90" }
perm_type  = { fg = "#79e29c" }
perm_read  = { fg = "#e2d479" }
perm_write = { fg = "#e27979" }
perm_exec  = { fg = "#8ab7e6" }

progress_label  = { fg = "#eeeef2", bold = true }
progress_normal = { fg = "#8ab7e6", bg = "#141e29" }
progress_error  = { fg = "#e27979", bg = "#141e29" }

[which]
border          = { fg = "#8ab7e6" }
cand            = { fg = "#8ab7e6" }
rest            = { fg = "#888b90" }
desc            = { fg = "#a579e2" }
separator_style = { fg = "#888b90" }

[confirm]
border  = { fg = "#8ab7e6" }
title   = { fg = "#8ab7e6" }
btn_yes = { fg = "#0c1218", bg = "#8ab7e6" }
btn_no  = { fg = "#8d949a" }

[spot]
border   = { fg = "#8ab7e6" }
title    = { fg = "#8ab7e6" }
tbl_col  = { fg = "#8ab7e6" }
tbl_cell = { fg = "#0c1218", bg = "#e2d479" }

[notify]
title_info  = { fg = "#79e29c" }
title_warn  = { fg = "#e2d479" }
title_error = { fg = "#e27979" }

[pick]
border   = { fg = "#8ab7e6" }
active   = { fg = "#e279ad", bold = true }
inactive = { fg = "#8d949a" }

[input]
border   = { fg = "#8ab7e6" }
title    = { fg = "#eeeef2" }
value    = { fg = "#eeeef2" }
selected = { fg = "#0c1218", bg = "#8ab7e6" }

[cmp]
border   = { fg = "#8ab7e6" }
active   = { fg = "#0c1218", bg = "#8ab7e6" }
inactive = { fg = "#8d949a" }

[tasks]
border  = { fg = "#8ab7e6" }
title   = { fg = "#eeeef2" }
hovered = { fg = "#e279ad", bold = true }

[help]
border  = { fg = "#8ab7e6" }
chord   = { fg = "#8ab7e6" }
action  = { fg = "#eeeef2" }
hovered = { fg = "#0c1218", bg = "#8ab7e6", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#e2d479" },
	{ mime = "**/{audio,video}/*", fg = "#e279ad" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e27979" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#e2b179" },
	{ mime = "vfs/{absent,stale}", fg = "#8d949a" },
	{ url = "*", is = "orphan", bg = "#e27979" },
	{ url = "*", is = "exec", fg = "#79e29c" },
	{ url = "*", is = "dummy", bg = "#e27979" },
	{ url = "*/", is = "dummy", bg = "#e27979" },
	{ url = "*/", fg = "#8ab7e6" },
]
