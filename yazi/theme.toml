# Generated by quickshell/scripts/apply-theme — edit theme.json instead.

[mgr]
cwd = { fg = "#8be9fd" }

find_keyword  = { fg = "#f1fa8c", bold = true, italic = true, underline = true }
find_position = { fg = "#ff79c6", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "#8b949e", italic = true }

marker_copied   = { fg = "#50fa7b",  bg = "#50fa7b" }
marker_cut      = { fg = "#ff5555",    bg = "#ff5555" }
marker_marked   = { fg = "#8be9fd", bg = "#8be9fd" }
marker_selected = { fg = "#f1fa8c", bg = "#f1fa8c" }

count_copied   = { fg = "#0d1117", bg = "#50fa7b" }
count_cut      = { fg = "#0d1117", bg = "#ff5555" }
count_selected = { fg = "#0d1117", bg = "#f1fa8c" }

border_symbol = "│"
border_style  = { fg = "#161b22" }

[tabs]
active   = { fg = "#0d1117", bg = "#8be9fd", bold = true }
inactive = { fg = "#8b949e", bg = "#161b22" }

[mode]
normal_main = { fg = "#0d1117", bg = "#8be9fd", bold = true }
normal_alt  = { fg = "#8be9fd", bg = "#161b22" }
select_main = { fg = "#0d1117", bg = "#50fa7b", bold = true }
select_alt  = { fg = "#50fa7b", bg = "#161b22" }
unset_main  = { fg = "#0d1117", bg = "#ffb86c", bold = true }
unset_alt   = { fg = "#ffb86c", bg = "#161b22" }

[status]
perm_sep   = { fg = "#929497" }
perm_type  = { fg = "#50fa7b" }
perm_read  = { fg = "#f1fa8c" }
perm_write = { fg = "#ff5555" }
perm_exec  = { fg = "#8be9fd" }

progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#8be9fd", bg = "#161b22" }
progress_error  = { fg = "#ff5555", bg = "#161b22" }

[which]
border          = { fg = "#8be9fd" }
cand            = { fg = "#8be9fd" }
rest            = { fg = "#929497" }
desc            = { fg = "#bd93f9" }
separator_style = { fg = "#929497" }

[confirm]
border  = { fg = "#8be9fd" }
title   = { fg = "#8be9fd" }
btn_yes = { fg = "#0d1117", bg = "#8be9fd" }
btn_no  = { fg = "#8b949e" }

[spot]
border   = { fg = "#8be9fd" }
title    = { fg = "#8be9fd" }
tbl_col  = { fg = "#8be9fd" }
tbl_cell = { fg = "#0d1117", bg = "#f1fa8c" }

[notify]
title_info  = { fg = "#50fa7b" }
title_warn  = { fg = "#f1fa8c" }
title_error = { fg = "#ff5555" }

[pick]
border   = { fg = "#8be9fd" }
active   = { fg = "#ff79c6", bold = true }
inactive = { fg = "#8b949e" }

[input]
border   = { fg = "#8be9fd" }
title    = { fg = "#ffffff" }
value    = { fg = "#ffffff" }
selected = { fg = "#0d1117", bg = "#8be9fd" }

[cmp]
border   = { fg = "#8be9fd" }
active   = { fg = "#0d1117", bg = "#8be9fd" }
inactive = { fg = "#8b949e" }

[tasks]
border  = { fg = "#8be9fd" }
title   = { fg = "#ffffff" }
hovered = { fg = "#ff79c6", bold = true }

[help]
border  = { fg = "#8be9fd" }
chord   = { fg = "#8be9fd" }
action  = { fg = "#ffffff" }
hovered = { fg = "#0d1117", bg = "#8be9fd", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#f1fa8c" },
	{ mime = "**/{audio,video}/*", fg = "#ff79c6" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ff5555" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#ffb86c" },
	{ mime = "vfs/{absent,stale}", fg = "#8b949e" },
	{ url = "*", is = "orphan", bg = "#ff5555" },
	{ url = "*", is = "exec", fg = "#50fa7b" },
	{ url = "*", is = "dummy", bg = "#ff5555" },
	{ url = "*/", is = "dummy", bg = "#ff5555" },
	{ url = "*/", fg = "#8be9fd" },
]
